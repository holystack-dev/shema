name: Build & deploy firmware installer

# Builds the firmware with ESP-IDF v5.3.2, merges it into a single flashable
# image, and publishes the web installer (installer/ + firmware.bin) to GitHub Pages.
#
# Setup once:  Settings -> Pages -> Source: "GitHub Actions".
# Trigger:     push a tag like  v1.0.0   (or run manually from the Actions tab).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # attach firmware.bin to the GitHub Release
  pages: write      # deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build AND merge inside the IDF container so the esptool version that
      # produced flasher_args.json is the one that consumes it.
      - name: Build & merge firmware (ESP-IDF v5.3.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: audio_bible
          command: |
            idf.py build
            cd build
            # Merge using the build-generated flash_args (offsets + flash mode/size/freq),
            # so a partition-table change can't desync the installer image from the layout
            # the build actually produced (F-19).
            esptool.py --chip esp32s3 merge_bin -o firmware.bin @flash_args

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -r installer/* site/
          cp audio_bible/build/firmware.bin site/firmware.bin
          # Stamp the release tag into the manifest version (was a static "1.0.0" that CI
          # never updated). Falls back to "dev" for a manual (workflow_dispatch) run.
          VERSION="${GITHUB_REF_NAME:-dev}"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${VERSION}\"/" site/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Attach firmware to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: audio_bible/build/firmware.bin

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
