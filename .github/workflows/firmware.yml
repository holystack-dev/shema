name: Release firmware installer

# On a v* tag, build the firmware, merge it into a single flashable image, and
# publish it by committing installer/firmware.bin + a version-stamped
# installer/manifest.json back to main.
#
# The web installer (holystack.dev/shema/flash) fetches the firmware directly from
#   raw.githubusercontent.com/holystack-dev/shema/main/installer/firmware.bin
# so committing to main is what actually goes live — no GitHub Pages involved.
#
# Runs inside the official ESP-IDF image (reproducible, and avoids the flaky
# esp-idf-ci-action wrapper). Release flow: merge to main, then tag main's HEAD:
#   git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # commit the built firmware to main + create the Release

concurrency:
  group: release-firmware
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      # Check out main (not the detached tag) so the freshly-built artifact can be
      # committed straight back onto main. Create the release tag at main's HEAD.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build & merge firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd audio_bible
          idf.py build
          # Merge using the build's own flasher args (offsets + flash mode/size/freq);
          # output lands at build/firmware.bin.
          idf.py merge-bin -o firmware.bin

      - name: Place firmware + stamp manifest from the tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VERSION="${TAG#v}"        # strip a leading v for a clean semver in the manifest
          cp audio_bible/build/firmware.bin installer/firmware.bin
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"${VERSION}\"/" installer/manifest.json

      - name: Commit installer artifacts to main
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installer/firmware.bin installer/manifest.json
          if git diff --cached --quiet; then
            echo "installer already up to date; nothing to commit"
          else
            git commit -m "Release ${TAG}: rebuild installer firmware"
            git push origin HEAD:main
          fi

      - name: Attach firmware to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: audio_bible/build/firmware.bin
